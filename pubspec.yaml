name: krishokbondhon
description: "KrishokBondhon — AI-powered smart & sustainable farming companion for Assam and Meghalaya."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Networking
  dio: ^5.4.3+1
  socket_io_client: ^2.0.3+1

  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  smooth_page_indicator: ^1.1.0
  fl_chart: ^0.68.0
  percent_indicator: ^4.2.3
  badges: ^3.1.2
  flutter_staggered_grid_view: ^0.7.0
  lottie: ^3.1.2
  shimmer_animation: ^2.1.0+1
  animate_do: ^3.3.4

  # Camera & media
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  photo_view: ^0.15.0

  # Local storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3

  # Localization
  easy_localization: ^3.0.7

  # Voice / speech
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2

  # Auth / OTP
  pin_code_fields: ^8.0.1

  # Utilities
  intl: ^0.20.2
  equatable: ^2.0.5
  connectivity_plus: ^6.0.3
  permission_handler: ^11.3.1
  url_launcher: ^6.2.6
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  flutter_dotenv: ^5.1.0
  logger: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lang/
    - .env

  # Poppins is loaded at runtime via the google_fonts package (see
  # core/theme/app_theme.dart), so no local font files are bundled here.
  # If you prefer fully offline font loading, drop the four Poppins .ttf
  # files into assets/fonts/ and re-add a `fonts:` block referencing them.